# Cilium 공식 Star Wars 데모 (L3/L4 + L7 정책 실습용)
#
#   deathstar  : HTTP 서버 2개 (Service 로 묶여 있다)
#                 GET/POST /v1/request-landing  착륙 요청
#                 PUT      /v1/exhaust-port     배기구 (여기가 터지면 죽는다)
#   tiefighter : 제국 소속 클라이언트 (org=empire)
#   xwing      : 반란군 소속 클라이언트 (org=alliance)
#
# 라벨(org, class)이 곧 정책의 대상이다. IP 가 아니라 라벨로 정책을 쓴다는 것이
# Cilium(그리고 eBPF 기반 네트워킹)의 핵심 아이디어다.
---
apiVersion: v1
kind: Service
metadata:
  name: deathstar
spec:
  type: ClusterIP
  ports:
    - port: 80
  selector:
    org: empire
    class: deathstar
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deathstar
spec:
  replicas: 2
  selector:
    matchLabels:
      org: empire
      class: deathstar
  template:
    metadata:
      labels:
        org: empire
        class: deathstar
    spec:
      containers:
        - name: deathstar
          image: docker.io/cilium/starwars
          imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: Pod
metadata:
  name: tiefighter
  labels:
    org: empire
    class: tiefighter
spec:
  containers:
    - name: spaceship
      image: docker.io/cilium/json-mock
      imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: Pod
metadata:
  name: xwing
  labels:
    org: alliance
    class: xwing
spec:
  containers:
    - name: spaceship
      image: docker.io/cilium/json-mock
      imagePullPolicy: IfNotPresent
